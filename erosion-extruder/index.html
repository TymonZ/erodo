<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Erosion Extruder - Height Map to 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/exporters/GLTFExporter.js"></script>
  <style>
    :root {
      --sidebar-width: 340px;
      --bg: #ffffff;
      --panel: #f6f7f8;
      --ink: #14171b;
      --button-ink: #ebebeb;
      --muted: #5f6775;
      --accent: #000000;
      --stroke: #d7dde4;
      --field-bg: #ffffff;
      --shadow: 0 8px 24px rgba(20, 23, 27, 0.12);
    }

    body.dark {
      --bg: #0a0a0a;
      --panel: #111111;
      --ink: #ebebeb;
      --button-ink: #08271a;
      --muted: #a0a0a0;
      --accent: #c6c6c6;
      --stroke: #2a2a2a;
      --field-bg: #1a1a1a;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .wrap {
      height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      overflow: hidden;
    }

    .ui {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow-y: auto;
      background: var(--panel);
      border-right: 1px solid var(--stroke);
      border-radius: 0;
      box-shadow: var(--shadow);
      padding: 8px 10px 8px;
      display: grid;
      align-content: start;
      gap: 8px 8px;
      z-index: 10;
    }

    .ui .row {
      display: grid;
      gap: 2px;
      margin: 0;
      width: min(190px, 100%);
    }

    h1 {
      width: 100%;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    label {
      display: flex;
      justify-content: flex-start;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      align-items: center;
      letter-spacing: 0.2px;
      margin: 0;
    }

    input,
    select,
    button {
      border-radius: 8px;
      border: 1px solid var(--stroke);
      background: var(--field-bg);
      color: var(--ink);
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
    }

    input[type="file"] {
      display: none;
    }

    input[type="file"] {
      width: 100%;
      padding: 6px 8px;
      background: var(--accent);
      color: #08271a;
      font-weight: 700;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      border: 0;
      border-radius: 6px;
      margin-right: 10px;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    input[type="file"]::-webkit-file-upload-button {
      border: 0;
      border-radius: 6px;
      margin-right: 10px;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    input,
    select {
      width: 180px;
    }

    .ui select,
    .ui input[type="number"] {
      margin-left: auto;
    }

    .ui input[type="range"] {
      margin-left: auto;
      flex: 1;
    }

    .ui input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-left: auto;
      accent-color: #777777;
    }

    button {
      background: var(--accent);
      color: var(--button-ink);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.2s ease;
    }

    .file-trigger {
      width: 100%;
    }

    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }

    .hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }

    .small {
      font-size: 11px;
      color: var(--muted);
    }

    .toggle {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 180px;
      padding: 6px 8px;
      border: 1px solid var(--stroke);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #777777;
    }

    .toggle label {
      margin: 0;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .ui > button,
    .ui > input[type="file"],
    .ui > label,
    .ui > .hint,
    .ui > .small {
      width: 100%;
    }

    .ui > button {
      margin: 0;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--stroke);
      margin: 16px 0;
    }

    .stage {
      position: relative;
      min-width: 0;
      width: 100% !important;
      height: 100vh !important;
      overflow: hidden;
      background: var(--bg);
    }

    .stage-header {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      z-index: 5;
      pointer-events: none;
    }

    #canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #heightMapPreview {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 120px;
      height: 120px;
      border: 1px solid var(--stroke);
      border-radius: 8px;
      background: var(--field-bg);
      box-shadow: var(--shadow);
      z-index: 10;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    @media (max-width: 980px) {
      :root { --sidebar-width: 300px; }
      .ui {
        padding: 8px 10px 8px;
        gap: 8px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ui">
      <h1>Erosion Extruder</h1>
      <div class="divider" aria-hidden="true"></div>
      <button id="chooseFile" class="file-trigger" type="button">Load height map</button>
      <input id="file" type="file" accept="image/png,image/jpeg,image/*">
      <label>Invert heights <input id="invertHeights" type="checkbox"></label>
      <label>Scale <input id="scale" type="range" min="0.1" max="5" step="0.1" value="1"><span id="scaleVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">1.0</span></label>
      <label>Base height <input id="baseHeight" type="range" min="0.1" max="5" step="0.1" value="1"><span id="baseHeightVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">1.0</span></label>
      <label>Blur <input id="blur" type="range" min="0" max="20" step="0.5" value="0"><span id="blurVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">0.0</span></label>
      <label>Segments <input id="segments" type="range" min="4" max="512" step="1" value="32"><span id="segmentsVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">32</span></label>
      <label>Rotation X <input id="rotX" type="range" min="-3.14" max="3.14" step="0.1" value="0.5"><span id="rotXVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">0.5</span></label>
      <label>Rotation Y <input id="rotY" type="range" min="-3.14" max="3.14" step="0.1" value="0.5"><span id="rotYVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">0.5</span></label>
      <label>Rotation Z <input id="rotZ" type="range" min="-3.14" max="3.14" step="0.1" value="0"><span id="rotZVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">0.0</span></label>
      <div class="divider" aria-hidden="true"></div>
      <label>Wireframe <input id="wireframe" type="checkbox"></label>
      <label>Auto-rotate <input id="autoRotate" type="checkbox" checked></label>
      <label>Crisp pixels <input id="crispPixels" type="checkbox"></label>
      <button id="reset">Reset view</button>
      <div class="divider" aria-hidden="true"></div>
      <button id="exportGLB">Export GLB</button>
      <button id="exportGLTF">Export GLTF</button>
      <div class="hint">Drag to rotate, scroll to zoom.</div>
    </div>
    <div class="stage" id="canvasHost">
      <div class="stage-header" id="resultInfo">Load a height map</div>
      <canvas id="canvas"></canvas>
      <canvas id="heightMapPreview"></canvas>
    </div>
  </div>

  <div class="toggle">
    <input id="darkMode" type="checkbox">
    <label for="darkMode">Dark mode</label>
  </div>

  <script>
    // Shared state
    let scene, camera, renderer, cube, controls;
    let heightMapImage = null;
    let imageWidth = 0, imageHeight = 0;
    let orbitControls = null;

    const DEFAULT_UI_VALUES = {
      invertHeights: false,
      scale: 1,
      baseHeight: 1,
      blur: 0,
      segments: 32,
      rotX: 0.5,
      rotY: 0.5,
      rotZ: 0,
      wireframe: false,
      autoRotate: true,
      crispPixels: false,
      darkMode: false
    };

    async function loadUiConfig() {
      try {
        const res = await fetch("../ui-config.json", { cache: 'no-store' });
        if (!res.ok) throw new Error('Could not fetch ui-config.json');
        const config = await res.json();
        if (config.erosionExtruder && config.erosionExtruder.defaults) {
          Object.assign(DEFAULT_UI_VALUES, config.erosionExtruder.defaults);
        }
      } catch (err) {
        console.warn('Using built-in erosion extruder defaults.', err);
      }
    }

    function applyUIConfig() {
      Object.entries(DEFAULT_UI_VALUES).forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.type === 'checkbox') {
          el.checked = Boolean(value);
        } else {
          el.value = String(value);
        }
        updateValueDisplay(id);
      });
    }

    function isDarkModeEnabled() {
      const el = document.getElementById('darkMode');
      return !!(el && el.checked);
    }

    function applyTheme() {
      document.body.classList.toggle('dark', isDarkModeEnabled());
      if (renderer) {
        renderer.setClearColor(isDarkModeEnabled() ? 0x0a0a0a : 0xffffff, 1);
      }
    }

    function updateValueDisplay(id) {
      const el = document.getElementById(id);
      const valEl = document.getElementById(id + 'Val');
      if (!el || !valEl) return;
      
      if (id === 'scale' || id === 'baseHeight' || id === 'blur') {
        valEl.textContent = parseFloat(el.value).toFixed(1);
      } else if (id === 'segments') {
        valEl.textContent = el.value;
      } else if (id.startsWith('rot')) {
        valEl.textContent = parseFloat(el.value).toFixed(1);
      }
    }

    function initThreeJs() {
      const canvas = document.getElementById('canvas');
      
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(isDarkModeEnabled() ? 0x0a0a0a : 0xffffff);
      
      // Camera
      camera = new THREE.PerspectiveCamera(
        75,
        canvas.clientWidth / canvas.clientHeight,
        0.1,
        1000
      );
      camera.position.set(0, 3, 0);
      camera.lookAt(0, 0, 0);
      
      // Renderer
      renderer = new THREE.WebGLRenderer({ canvas, antialias: !document.getElementById('crispPixels')?.checked, alpha: true });
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      
      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 7);
      scene.add(directionalLight);
      
      // Orbit Controls
      orbitControls = new OrbitControls(camera, renderer.domElement);
      orbitControls.enableDamping = true;
      orbitControls.dampingFactor = 0.05;
      orbitControls.autoRotate = false;
      orbitControls.autoRotateSpeed = 4;
      
      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        
        if (orbitControls) {
          orbitControls.update();
        }
        
        if (cube) {
          const autoRotate = document.getElementById('autoRotate')?.checked || false;
          if (!autoRotate) {
            const rotX = parseFloat(document.getElementById('rotX')?.value || 0.5);
            const rotY = parseFloat(document.getElementById('rotY')?.value || 0.5);
            const rotZ = parseFloat(document.getElementById('rotZ')?.value || 0);
            cube.rotation.x = rotX;
            cube.rotation.y = rotY;
            cube.rotation.z = rotZ;
          }
        }
        
        renderer.render(scene, camera);
      }
      animate();
      
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      const canvas = document.getElementById('canvas');
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    class OrbitControls {
      constructor(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;
        this.enableDamping = false;
        this.dampingFactor = 0.05;
        this.autoRotate = false;
        this.autoRotateSpeed = 4;
        
        this.theta = Math.PI / 2;
        this.phi = 0.1;
        this.radius = 3;
        this.target = new THREE.Vector3(0, 0, 0);
        
        this.isDragging = false;
        this.previousMousePosition = { x: 0, y: 0 };
        
        this.domElement.addEventListener('mousedown', (e) => this.onMouseDown(e));
        this.domElement.addEventListener('mousemove', (e) => this.onMouseMove(e));
        this.domElement.addEventListener('mouseup', (e) => this.onMouseUp(e));
        this.domElement.addEventListener('wheel', (e) => this.onMouseWheel(e));
      }
      
      update() {
        if (this.autoRotate) {
          this.theta += 0.005;
        }
        
        const x = this.radius * Math.sin(this.phi) * Math.cos(this.theta);
        const z = this.radius * Math.sin(this.phi) * Math.sin(this.theta);
        const y = this.radius * Math.cos(this.phi);
        
        this.camera.position.set(x + this.target.x, y + this.target.y, z + this.target.z);
        this.camera.lookAt(this.target);
      }
      
      onMouseDown(e) {
        this.isDragging = true;
        this.previousMousePosition = { x: e.clientX, y: e.clientY };
      }
      
      onMouseMove(e) {
        if (!this.isDragging) return;
        
        const deltaX = e.clientX - this.previousMousePosition.x;
        const deltaY = e.clientY - this.previousMousePosition.y;
        
        this.theta -= deltaX * 0.01;
        this.phi -= deltaY * 0.01;
        this.phi = Math.max(0.1, Math.min(Math.PI - 0.1, this.phi));
        
        this.previousMousePosition = { x: e.clientX, y: e.clientY };
      }
      
      onMouseUp(e) {
        this.isDragging = false;
      }
      
      onMouseWheel(e) {
        e.preventDefault();
        this.radius += e.deltaY * 0.01;
        this.radius = Math.max(1, Math.min(100, this.radius));
      }
    }

    function updateHeightMapPreview(img) {
      const previewCanvas = document.getElementById('heightMapPreview');
      if (!previewCanvas || !img) return;
      
      const ctx = previewCanvas.getContext('2d');
      const previewSize = 120;
      
      previewCanvas.width = previewSize;
      previewCanvas.height = previewSize;
      
      // Calculate aspect ratio and fit image in preview
      const imgAspect = img.width / img.height;
      let drawWidth = previewSize;
      let drawHeight = previewSize;
      
      if (imgAspect > 1) {
        drawHeight = previewSize / imgAspect;
      } else {
        drawWidth = previewSize * imgAspect;
      }
      
      const x = (previewSize - drawWidth) / 2;
      const y = (previewSize - drawHeight) / 2;
      
      ctx.fillStyle = isDarkModeEnabled() ? '#1a1a1a' : '#ffffff';
      ctx.fillRect(0, 0, previewSize, previewSize);
      ctx.drawImage(img, x, y, drawWidth, drawHeight);
    }

    function applyGaussianBlur(imageData, radius) {
      if (radius <= 0) return imageData;
      
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;
      
      // Create temp buffer
      const tempData = new Uint8ClampedArray(data);
      const r = Math.ceil(radius);
      
      // Horizontal pass
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let rv = 0, gv = 0, bv = 0, av = 0, count = 0;
          
          for (let xx = Math.max(0, x - r); xx <= Math.min(width - 1, x + r); xx++) {
            const idx = (y * width + xx) * 4;
            rv += tempData[idx];
            gv += tempData[idx + 1];
            bv += tempData[idx + 2];
            av += tempData[idx + 3];
            count++;
          }
          
          const idx = (y * width + x) * 4;
          data[idx] = rv / count;
          data[idx + 1] = gv / count;
          data[idx + 2] = bv / count;
          data[idx + 3] = av / count;
        }
      }
      
      // Copy back
      tempData.set(data);
      
      // Vertical pass
      for (let x = 0; x < width; x++) {
        for (let y = 0; y < height; y++) {
          let rv = 0, gv = 0, bv = 0, av = 0, count = 0;
          
          for (let yy = Math.max(0, y - r); yy <= Math.min(height - 1, y + r); yy++) {
            const idx = (yy * width + x) * 4;
            rv += tempData[idx];
            gv += tempData[idx + 1];
            bv += tempData[idx + 2];
            av += tempData[idx + 3];
            count++;
          }
          
          const idx = (y * width + x) * 4;
          data[idx] = rv / count;
          data[idx + 1] = gv / count;
          data[idx + 2] = bv / count;
          data[idx + 3] = av / count;
        }
      }
      
      return imageData;
    }

    function getBlurredHeightData(img) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      
      const blurAmount = parseFloat(document.getElementById('blur')?.value || 0);
      if (blurAmount > 0) {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        applyGaussianBlur(imageData, blurAmount);
        ctx.putImageData(imageData, 0, 0);
      }
      
      return ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function createDisplacedCube(heightMap, width, height) {
      const segments = parseInt(document.getElementById('segments')?.value || 32);
      const scale = parseFloat(document.getElementById('scale')?.value || 1);
      const baseHeight = parseFloat(document.getElementById('baseHeight')?.value || 1);
      const invert = document.getElementById('invertHeights')?.checked || false;
      
      // Create a cube with subdivisions on top face
      const geometry = new THREE.BoxGeometry(2, baseHeight, 2, segments, 1, segments);
      
      // Get blurred height map data
      const imageData = getBlurredHeightData(heightMap);
      const data = imageData.data;
      
      // Modify geometry based on height map (top face only)
      const positionAttribute = geometry.getAttribute('position');
      const positions = positionAttribute.array;
      
      for (let i = 0; i < positionAttribute.count; i++) {
        const x = positions[i * 3];
        const z = positions[i * 3 + 2];
        const y = positions[i * 3 + 1];
        
        // Only displace vertices on the top face (y ≈ baseHeight/2)
        const halfHeight = baseHeight / 2;
        if (Math.abs(y - halfHeight) < 0.01) {
          // Map cube coords to texture coords
          const u = (x + 1) / 2;
          const v = (z + 1) / 2;
          
          const pixelX = Math.floor(u * (width - 1));
          const pixelY = Math.floor(v * (height - 1));
          const pixelIndex = (pixelY * width + pixelX) * 4;
          
          // Get brightness (average of RGB)
          const brightness = (data[pixelIndex] + data[pixelIndex + 1] + data[pixelIndex + 2]) / 3 / 255;
          const displacement = invert ? (1 - brightness) * scale : brightness * scale;
          
          positions[i * 3 + 1] = halfHeight + displacement;
        }
      }
      
      positionAttribute.needsUpdate = true;
      geometry.computeVertexNormals();
      
      const material = new THREE.MeshPhongMaterial({
        color: 0x888888,
        wireframe: document.getElementById('wireframe')?.checked || false,
        emissive: 0x111111
      });
      
      const mesh = new THREE.Mesh(geometry, material);
      return mesh;
    }

    function loadHeightMap(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          heightMapImage = img;
          imageWidth = img.width;
          imageHeight = img.height;
          
          // Update preview
          updateHeightMapPreview(img);
          
          // Set segments to match texture resolution
          const maxDim = Math.max(img.width, img.height);
          const segmentsEl = document.getElementById('segments');
          segmentsEl.value = maxDim;
          updateValueDisplay('segments');
          
          // Remove old cube
          if (cube && scene) {
            scene.remove(cube);
          }
          
          // Create new cube
          cube = createDisplacedCube(img, img.width, img.height);
          scene.add(cube);
          
          // Update info
          document.getElementById('resultInfo').textContent = `${img.width} x ${img.height} px`;
          
          // Reset camera
          camera.position.set(0, 3, 0);
          camera.lookAt(0, 0, 0);
          if (orbitControls) {
            orbitControls.radius = 3;
            orbitControls.theta = -Math.PI / 2;
            orbitControls.phi = 0.1;
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setupEventListeners() {
      document.getElementById('chooseFile').addEventListener('click', () => {
        document.getElementById('file').click();
      });
      
      document.getElementById('file').addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          loadHeightMap(e.target.files[0]);
        }
      });
      
      document.getElementById('scale').addEventListener('input', (e) => {
        updateValueDisplay('scale');
        if (heightMapImage && cube) {
          scene.remove(cube);
          cube = createDisplacedCube(heightMapImage, imageWidth, imageHeight);
          scene.add(cube);
        }
      });
      
      document.getElementById('baseHeight').addEventListener('input', (e) => {
        updateValueDisplay('baseHeight');
        if (heightMapImage && cube) {
          scene.remove(cube);
          cube = createDisplacedCube(heightMapImage, imageWidth, imageHeight);
          scene.add(cube);
        }
      });
      
      document.getElementById('blur').addEventListener('input', (e) => {
        updateValueDisplay('blur');
        if (heightMapImage && cube) {
          scene.remove(cube);
          cube = createDisplacedCube(heightMapImage, imageWidth, imageHeight);
          scene.add(cube);
        }
      });
      
      document.getElementById('segments').addEventListener('input', (e) => {
        updateValueDisplay('segments');
        if (heightMapImage && cube) {
          scene.remove(cube);
          cube = createDisplacedCube(heightMapImage, imageWidth, imageHeight);
          scene.add(cube);
        }
      });
      
      document.getElementById('invertHeights').addEventListener('change', (e) => {
        if (heightMapImage && cube) {
          scene.remove(cube);
          cube = createDisplacedCube(heightMapImage, imageWidth, imageHeight);
          scene.add(cube);
        }
      });
      
      document.getElementById('rotX').addEventListener('input', (e) => {
        updateValueDisplay('rotX');
      });
      
      document.getElementById('rotY').addEventListener('input', (e) => {
        updateValueDisplay('rotY');
      });
      
      document.getElementById('rotZ').addEventListener('input', (e) => {
        updateValueDisplay('rotZ');
      });
      
      document.getElementById('wireframe').addEventListener('change', (e) => {
        if (cube) {
          cube.material.wireframe = e.target.checked;
        }
      });
      
      document.getElementById('autoRotate').addEventListener('change', (e) => {
        if (orbitControls) {
          orbitControls.autoRotate = e.target.checked;
        }
      });
      
      document.getElementById('crispPixels').addEventListener('change', (e) => {
        if (renderer) {
          // Dispose and recreate renderer
          const canvas = document.getElementById('canvas');
          renderer.dispose();
          renderer = new THREE.WebGLRenderer({ canvas, antialias: !e.target.checked, alpha: true });
          renderer.setSize(canvas.clientWidth, canvas.clientHeight);
          renderer.setPixelRatio(window.devicePixelRatio);
          renderer.setClearColor(isDarkModeEnabled() ? 0x0a0a0a : 0xffffff, 1);
        }
      });
      
      document.getElementById('reset').addEventListener('click', () => {
        camera.position.set(0, 3, 0);
        camera.lookAt(0, 0, 0);
        if (orbitControls) {
          orbitControls.radius = 3;
          orbitControls.theta = -Math.PI / 2;
          orbitControls.phi = 0.1;
        }
      });
      
      document.getElementById('darkMode').addEventListener('change', applyTheme);
      
      document.getElementById('exportGLB').addEventListener('click', () => exportModel('glb'));
      document.getElementById('exportGLTF').addEventListener('click', () => exportModel('gltf'));
    }

    function exportModel(format) {
      if (!cube) {
        alert('No model to export. Load or create a height map first.');
        return;
      }
      
      const exporter = new THREE.GLTFExporter();
      const options = {
        binary: format === 'glb',
        onlyVisible: true
      };
      
      exporter.parse(cube, (data) => {
        const blob = format === 'glb' ? new Blob([data], { type: 'application/octet-stream' }) : new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `erosion-extruder.${format === 'glb' ? 'glb' : 'gltf'}`;
        link.click();
        URL.revokeObjectURL(url);
      }, (error) => {
        console.error('Export error:', error);
        alert('Error exporting model: ' + error.message);
      }, options);
    }

    function loadDefaultHeightMap() {
      const img = new Image();
      img.onload = () => {
        heightMapImage = img;
        imageWidth = img.width;
        imageHeight = img.height;
        
        // Update preview
        updateHeightMapPreview(img);
        
        // Set segments to match texture resolution
        const maxDim = Math.max(img.width, img.height);
        const segmentsEl = document.getElementById('segments');
        segmentsEl.value = maxDim;
        updateValueDisplay('segments');
        
        if (cube && scene) {
          scene.remove(cube);
        }
        
        cube = createDisplacedCube(img, img.width, img.height);
        scene.add(cube);
        
        document.getElementById('resultInfo').textContent = `${img.width} x ${img.height} px (default)`;
        
        camera.position.set(0, 3, 0);
        camera.lookAt(0, 0, 0);
        if (orbitControls) {
          orbitControls.radius = 3;
          orbitControls.theta = -Math.PI / 2;
          orbitControls.phi = 0.1;
        }
      };
      img.src = '../assets/eroded_gradient.png';
    }

    // Initialize
    async function init() {
      await loadUiConfig();
      applyUIConfig();
      applyTheme();
      initThreeJs();
      setupEventListeners();
      // Load default height map
      setTimeout(loadDefaultHeightMap, 100);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
