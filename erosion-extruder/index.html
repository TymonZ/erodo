<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Erosion Extruder - Height Map to 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    :root {
      --sidebar-width: 340px;
      --bg: #ffffff;
      --panel: #f6f7f8;
      --ink: #14171b;
      --button-ink: #ebebeb;
      --muted: #5f6775;
      --accent: #000000;
      --stroke: #d7dde4;
      --field-bg: #ffffff;
      --shadow: 0 8px 24px rgba(20, 23, 27, 0.12);
    }

    body.dark {
      --bg: #0a0a0a;
      --panel: #111111;
      --ink: #ebebeb;
      --button-ink: #08271a;
      --muted: #a0a0a0;
      --accent: #c6c6c6;
      --stroke: #2a2a2a;
      --field-bg: #1a1a1a;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .wrap {
      height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      overflow: hidden;
    }

    .ui {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: auto;
      background: var(--panel);
      border-right: 1px solid var(--stroke);
      border-radius: 0;
      box-shadow: var(--shadow);
      padding: 8px 10px 8px;
      display: grid;
      align-content: start;
      gap: 8px 8px;
      z-index: 10;
    }

    .ui .row {
      display: grid;
      gap: 2px;
      margin: 0;
      width: min(190px, 100%);
    }

    h1 {
      width: 100%;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    label {
      display: flex;
      justify-content: flex-start;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      align-items: center;
      letter-spacing: 0.2px;
      margin: 0;
    }

    input,
    select,
    button {
      border-radius: 8px;
      border: 1px solid var(--stroke);
      background: var(--field-bg);
      color: var(--ink);
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
    }

    input[type="file"] {
      display: none;
    }

    input[type="file"] {
      width: 100%;
      padding: 6px 8px;
      background: var(--accent);
      color: #08271a;
      font-weight: 700;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      border: 0;
      border-radius: 6px;
      margin-right: 10px;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    input[type="file"]::-webkit-file-upload-button {
      border: 0;
      border-radius: 6px;
      margin-right: 10px;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    input,
    select {
      width: 180px;
    }

    .ui select,
    .ui input[type="number"] {
      margin-left: auto;
    }

    .ui input[type="range"] {
      margin-left: auto;
    }

    .ui input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-left: auto;
      accent-color: #777777;
    }

    .ui input[type="range"]:disabled {
      opacity: 0.35;
      filter: grayscale(1);
      cursor: not-allowed;
    }

    button {
      background: var(--accent);
      color: var(--button-ink);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.2s ease;
    }

    .file-trigger {
      width: 100%;
    }

    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }

    canvas { display: block; }

    .hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }

    .small {
      font-size: 11px;
      color: var(--muted);
    }

    .toggle {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 180px;
      padding: 6px 8px;
      border: 1px solid var(--stroke);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #777777;
    }

    .toggle label {
      margin: 0;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .small {
      margin: 0 0 2px;
    }

    .hint {
      margin: 0;
    }

    .ui > button,
    .ui > input[type="file"],
    .ui > label,
    .ui > .hint,
    .ui > .small {
      width: 100%;
    }

    .ui > button {
      margin: 0;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--stroke);
      margin: 16px 0;
    }

    .stage {
      position: relative;
      min-width: 0;
      width: 100% !important;
      height: 100vh !important;
      overflow: hidden;
      background: var(--bg);
    }

    .stage-header {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      z-index: 5;
      pointer-events: none;
    }

    .stage canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #canvasHost {
      display: block;
      justify-self: stretch;
      align-self: stretch;
    }

    @media (max-width: 980px) {
      :root { --sidebar-width: 300px; }
      .ui {
        padding: 8px 10px 8px;
        gap: 8px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ui">
      <h1>Erosion Extruder</h1>
      <div class="divider" aria-hidden="true"></div>
      <button id="chooseFile" class="file-trigger" type="button">Load height map</button>
      <input id="file" type="file" accept="image/png,image/jpeg,image/*">
      
      <div class="divider" aria-hidden="true"></div>
      
      <label>Extrusion scale
        <input id="extrusionScale" type="range" min="0.1" max="2" step="0.1" value="1">
        <span id="extrusionScaleVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">1.0</span>
      </label>
      
      <label>Invert height <input id="invertHeight" type="checkbox"></label>
      
      <label>Rotation X
        <input id="rotX" type="range" min="-180" max="180" value="0">
        <span id="rotXVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">0°</span>
      </label>
      
      <label>Rotation Y
        <input id="rotY" type="range" min="-180" max="180" value="0">
        <span id="rotYVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">0°</span>
      </label>
      
      <label>Rotation Z
        <input id="rotZ" type="range" min="-180" max="180" value="0">
        <span id="rotZVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">0°</span>
      </label>

      <label>Ambient light
        <input id="ambientLight" type="range" min="0" max="255" value="80">
        <span id="ambientLightVal" style="margin-left:8px;min-width:36px;display:inline-block;text-align:right">80</span>
      </label>

      <div class="divider" aria-hidden="true"></div>
      
      <button id="export">Export view</button>
      <div class="hint">Exports 1px per cell.</div>
      
      <canvas id="exportcanvas" style="display:none;"></canvas>
    </div>

    <div class="stage" id="canvasHost">
      <div class="stage-header" id="resultInfo">Load an image to start</div>
    </div>
  </div>

  <div class="toggle">
    <input id="darkMode" type="checkbox">
    <label for="darkMode">Dark mode</label>
  </div>

  <script>
    const UI_CONFIG_URL = "../ui-config.json";
    const DEFAULT_UI_VALUES = {
      extrusionScale: 1,
      invertHeight: false,
      rotX: 0,
      rotY: 0,
      rotZ: 0,
      ambientLight: 80,
      darkMode: false
    };

    async function loadUiConfig() {
      try {
        const res = await fetch(UI_CONFIG_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('Could not fetch ui-config.json');
        const config = await res.json();
        Object.assign(DEFAULT_UI_VALUES, (config.erosionExtruder && config.erosionExtruder.defaults) || {});
      } catch (err) {
        console.warn('Using built-in erosion extruder defaults.', err);
      }
    }

    let srcImg = null;
    let sourcePngName = null;
    let heightMapPixels = [];
    let mapWidth = 0, mapHeight = 0;
    let p5Instance = null;
    const SIDEBAR_WIDTH = 340;

    function updateResultInfo() {
      const info = document.getElementById('resultInfo');
      if(!info) return;
      if(!heightMapPixels || heightMapPixels.length === 0) {
        info.textContent = 'Load an image to start';
        return;
      }
      info.textContent = `${mapWidth} x ${mapHeight} px`;
    }

    function applyUIConfig(){
      Object.entries(DEFAULT_UI_VALUES).forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.type === 'checkbox') {
          el.checked = value;
        } else {
          el.value = value;
        }
      });
      updateUIValues();
    }

    function updateUIValues() {
      document.getElementById('extrusionScaleVal').textContent = parseFloat(document.getElementById('extrusionScale').value).toFixed(1);
      document.getElementById('rotXVal').textContent = document.getElementById('rotX').value + '°';
      document.getElementById('rotYVal').textContent = document.getElementById('rotY').value + '°';
      document.getElementById('rotZVal').textContent = document.getElementById('rotZ').value + '°';
      document.getElementById('ambientLightVal').textContent = document.getElementById('ambientLight').value;
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark', document.getElementById('darkMode').checked);
    }

    function sketch(p) {
      p.setup = function() {
        const host = document.getElementById('canvasHost');
        const w = host.clientWidth;
        const h = host.clientHeight;
        p.createCanvas(w, h, p.WEBGL);
      };

      p.windowResized = function() {
        const host = document.getElementById('canvasHost');
        if (!host) return;
        const w = host.clientWidth;
        const h = host.clientHeight;
        p.resizeCanvas(w, h);
      };

      p.draw = function() {
        const bgColor = document.body.classList.contains('dark') ? '#0a0a0a' : '#ffffff';
        p.background(bgColor);

        if (!heightMapPixels || heightMapPixels.length === 0) {
          return;
        }

        const extrusionScale = parseFloat(document.getElementById('extrusionScale').value);
        const invertHeight = document.getElementById('invertHeight').checked;
        const rotX = parseFloat(document.getElementById('rotX').value) * (p.PI / 180);
        const rotY = parseFloat(document.getElementById('rotY').value) * (p.PI / 180);
        const rotZ = parseFloat(document.getElementById('rotZ').value) * (p.PI / 180);
        const ambientLight = parseFloat(document.getElementById('ambientLight').value);

        p.rotateX(rotX);
        p.rotateY(rotY);
        p.rotateZ(rotZ);

        const cellSize = Math.max(2, Math.min(p.width, p.height) / Math.max(mapWidth, mapHeight) * 0.8);
        const offsetX = -(mapWidth * cellSize) / 2;
        const offsetY = -(mapHeight * cellSize) / 2;

        p.push();
        p.translate(offsetX, offsetY, 0);

        p.ambientLight(ambientLight, ambientLight, ambientLight);
        p.directionalLight(200, 200, 200, 0, 0, -1);

        for (let y = 0; y < mapHeight; y++) {
          for (let x = 0; x < mapWidth; x++) {
            const idx = y * mapWidth + x;
            const heightVal = heightMapPixels[idx];
            const height = invertHeight ? (1 - heightVal) : heightVal;
            const extrudedHeight = height * 200 * extrusionScale;

            p.push();
            p.translate(x * cellSize, y * cellSize, extrudedHeight / 2);

            const brightness = 100 + height * 155;
            p.fill(brightness);
            p.specularMaterial(200);
            p.box(cellSize * 0.95, cellSize * 0.95, extrudedHeight);

            p.pop();
          }
        }

        p.pop();
      };
    }

    document.getElementById('darkMode').addEventListener('change', toggleDarkMode);
    document.getElementById('extrusionScale').addEventListener('input', updateUIValues);
    document.getElementById('rotX').addEventListener('input', updateUIValues);
    document.getElementById('rotY').addEventListener('input', updateUIValues);
    document.getElementById('rotZ').addEventListener('input', updateUIValues);
    document.getElementById('ambientLight').addEventListener('input', updateUIValues);

    document.getElementById('chooseFile').addEventListener('click', () => {
      document.getElementById('file').click();
    });

    document.getElementById('file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      sourcePngName = file.name;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          srcImg = img;
          loadHeightMap(img);
          updateResultInfo();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function loadHeightMap(img) {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      
      mapWidth = canvas.width;
      mapHeight = canvas.height;
      heightMapPixels = [];
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const gray = (r + g + b) / 3 / 255;
        heightMapPixels.push(gray);
      }
    }

    document.getElementById('export').addEventListener('click', () => {
      if (!p5Instance) return;
      const canvas = document.querySelector('canvas');
      if (!canvas) return;
      
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      const baseName = sourcePngName ? sourcePngName.replace(/\.[^.]+$/, '') : 'extruded';
      link.download = `${baseName}_extruded.png`;
      link.click();
    });

    async function init() {
      await loadUiConfig();
      applyUIConfig();
      toggleDarkMode();
      p5Instance = new p5(sketch);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
